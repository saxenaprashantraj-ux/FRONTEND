<!DOCTYPE html>
<html>
<head>
    <title>Seminar Schedule</title>

    <style>
        table {
            border-collapse: collapse;
            width: 700px;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        th, td {
            border: 2px solid #777;
            padding: 8px;
        }

        th {
            background-color: #f2f2f2;
        }

        .time1 {
            background-color: #ffffcc;
        }

        .time2 {
            background-color: #ccffcc;
        }
    </style>
</head>

<body>

<table>

    <tr>
        <th rowspan="3">Day</th>
        <th colspan="2">Seminar</th>
        <th rowspan="3">Topic</th>
    </tr>

    <tr>
        <th colspan="2">Schedule</th>
    </tr>

    <tr>
        <th>Begin</th>
        <th>End</th>
    </tr>

    <tr>
        <td rowspan="2">Monday</td>
        <td class="time1">8:00 a.m.</td>
        <td class="time2">5:00 p.m.</td>
        <td>Introduction to XML</td>
    </tr>

    <tr>
        <td colspan="2"></td>
        <td>Validity: DTD and Relax NG</td>
    </tr>

    <tr>
        <td rowspan="3">Tuesday</td>
        <td class="time1">8:00 a.m.</td>
        <td class="time2">11:00 a.m.</td>
        <td rowspan="2">XPath</td>
    </tr>

    <tr>
        <td class="time1">11:00 a.m.</td>
        <td class="time2">2:00 p.m.</td>
    </tr>

    <tr>
        <td class="time1">2:00 p.m.</td>
        <td class="time2">5:00 p.m.</td>
        <td>XSL Transformations</td>
    </tr>

    <tr>
        <td>Wednesday</td>
        <td class="time1">8:00 a.m.</td>
        <td class="time2">12:00 p.m.</td>
        <td>XSL Formatting Objects</td>
    </tr>

</table>

</body>
</html>
